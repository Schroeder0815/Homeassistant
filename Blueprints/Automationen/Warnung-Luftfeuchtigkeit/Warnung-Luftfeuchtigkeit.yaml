blueprint:
  name: Luftfeuchtigkeits-Warnung
  description: Warnt bei erhöhter/zu hoher Luftfeuchtigkeit in einem Raum, sofern das Fenster geschlossen ist.
  source_url: https://github.com/Schroeder0815/Homeassistant/blob/main/Blueprints/Automationen/Warnung-Luftfeuchtigkeit/Warnung-Luftfeuchtigkeit.yaml
  domain: automation
  input:
    humidity_sensor:
      name: Feuchtigkeitssensor
      selector:
        entity:
          domain: sensor
          device_class: humidity
    window_sensor:
      name: Fenstersensor
      selector:
        entity:
          domain: binary_sensor
          device_class: window
    room_name:
      name: Raumname (für die Nachricht)
      selector:
        text:
    threshold_warn:
      name: Schwelle "erhöht"
      default: 1.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
    threshold_critical:
      name: Schwelle "zu hoch"
      default: 3.5
      selector:
        number:
          min: 0
          max: 10
          step: 0.1

triggers:
  - trigger: numeric_state
    entity_id: !input humidity_sensor
    above: !input threshold_warn
    id: warn
  - trigger: numeric_state
    entity_id: !input humidity_sensor
    above: !input threshold_critical
    id: critical

conditions:
  - condition: state
    entity_id: !input window_sensor
    state: "off"

actions:
  - choose:
      - conditions:
          - condition: trigger
            id: warn
        sequence:
          - action: script.notify_admin
            data:
              group_admins_enable: true
              group_family_enable: false
              alexa_enabled: false
              google_enabled: false
              critical_enabled: false
              title: "Luftfeuchtigkeit {{ room_name }}"
              message: "Luftfeuchtigkeit in {{ room_name }} erhöht"
      - conditions:
          - condition: trigger
            id: critical
        sequence:
          - action: script.notify_admin
            data:
              group_admins_enable: true
              group_family_enable: false
              alexa_enabled: false
              google_enabled: false
              critical_enabled: false
              title: "Luftfeuchtigkeit {{ room_name }}"
              message: "Luftfeuchtigkeit in {{ room_name }} zu hoch. Bitte Lüften!"

mode: single
